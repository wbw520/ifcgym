[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ifcgym"
version = "0.1.0"
description = "IfcGym: a verifiable editing environment for IFC building models, and IfcEdit, the agents trained in it"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = ["ifcopenshell==0.8.5", "numpy>=2.0", "shapely>=2.0", "scipy>=1.14", "openai>=1.50", "pyyaml", "pyarrow", "pydantic>=2"]

[project.optional-dependencies]
figures = ["matplotlib", "pillow"]
train = ["torch", "transformers", "peft", "verl==0.9.0"]

[tool.setuptools.packages.find]
include = ["ifcgym*", "ifcedit*"]
